services:
  - type: web
    name: empire-smart-dispatcher
    runtime: docker
    plan: starter          # upgrade to standard for always-on (no sleep)
    healthCheckPath: /health

    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # set manually in Render dashboard — never commit this
      - key: PORT
        value: 8000

    # On first deploy, build the ChromaDB index from the manuals.
    # Safe to re-run — chroma skips docs it has already embedded.
    preDeployCommand: >
      python -m src.enpal_dispatcher.ingest.build_index
