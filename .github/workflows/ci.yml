name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-check:
    name: Install + Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Pinned exact versions (see requirements.txt header) — a clean install here
      # catches dependency drift (e.g. an incompatible anthropic/langsmith pair)
      # before it ever reaches a deploy.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import sanity check
        run: python -c "import src.empire_dispatcher.api"

      - name: Build Docker image
        run: docker build -t empire-smart-dispatcher:ci .

  eval-gate:
    name: Eval suite (regression gate)
    needs: build-check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build RAG index
        run: python -m src.empire_dispatcher.ingest.build_index

      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m eval.run_evals
