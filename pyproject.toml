[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "empire-smart-dispatcher"
version = "0.1.0"
description = "Agentic ticket triage + dispatch for residential solar/heat-pump support."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "David" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
