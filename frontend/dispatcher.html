<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empire Smart-Dispatcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .skeleton { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .demo-reveal { animation: fadeInUp 0.35s ease both; }

    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #1c1917;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px;
      transition: opacity 0.5s ease;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }
    #splash-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #a8a29e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #splash-status {
      font-size: 13px; color: #a8a29e;
      letter-spacing: 0.04em;
      min-height: 20px;
      transition: opacity 0.3s;
    }
    #splash-logo {
      width: 44px; height: 44px; border-radius: 10px;
      background: #292524;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: #e7e5e4;
    }
  </style>
</head>
<body class="bg-stone-50">

  <!-- Splash shown while backend wakes up on Render free tier -->
  <div id="splash">
    <div id="splash-logo">E</div>
    <div id="splash-spinner"></div>
    <div id="splash-status">Connecting to server…</div>
  </div>

  <div id="root"></div>

  <script>
    (function () {
      const splash = document.getElementById("splash");
      const status = document.getElementById("splash-status");

      const messages = [
        "Connecting to server…",
        "Waking up the service…",
        "Loading tickets…",
        "Almost there…",
        "Hang tight…",
      ];
      let attempt = 0;

      function setStatus(text) {
        status.style.opacity = "0";
        setTimeout(() => { status.textContent = text; status.style.opacity = "1"; }, 200);
      }

      function hideSplash() {
        splash.classList.add("fade-out");
        setTimeout(() => splash.remove(), 520);
      }

      // Phase 2: health is ok, now fetch tickets + jobs until we get real data
      function fetchData() {
        setStatus("Loading tickets…");
        Promise.all([fetch("/tickets"), fetch("/jobs")])
          .then(async ([tRes, jRes]) => {
            if (!tRes.ok || !jRes.ok) throw new Error("not ready");
            const tickets = await tRes.json();
            const jobs    = await jRes.json();
            if (!tickets.length) throw new Error("empty");
            // Hand data to React before showing the app
            window.__PRELOADED__ = { tickets, jobs };
            hideSplash();
          })
          .catch(() => {
            attempt++;
            setStatus(messages[Math.min(attempt, messages.length - 1)]);
            setTimeout(fetchData, 2500);
          });
      }

      // Phase 1: wait for health
      function pollHealth() {
        fetch("/health")
          .then(r => { if (r.ok) { fetchData(); } else { retryHealth(); } })
          .catch(retryHealth);
      }

      function retryHealth() {
        attempt++;
        setStatus(messages[Math.min(attempt, messages.length - 1)]);
        setTimeout(pollHealth, 2500);
      }

      setTimeout(pollHealth, 300);
    })();
  </script>

  <script type="text/babel" data-presets="react" data-type="module">
    const { useState, useEffect, useMemo } = React;
    const API = ""; // same origin

    // ─────────────────────────────────────────────────────────────────────
    // Helpers
    // ─────────────────────────────────────────────────────────────────────
    const cls = (...xs) => xs.filter(Boolean).join(" ");

    const SEVERITY_STYLE = {
      high:   "bg-rose-100 text-rose-700 border-rose-200",
      medium: "bg-amber-100 text-amber-700 border-amber-200",
      low:    "bg-stone-100 text-stone-700 border-stone-200",
    };
    const STATUS_STYLE = {
      pending_approval: "bg-amber-100 text-amber-700 border-amber-200",
      scheduled:        "bg-emerald-100 text-emerald-700 border-emerald-200",
      rejected:         "bg-rose-100 text-rose-700 border-rose-200",
      no_dispatch:      "bg-stone-100 text-stone-700 border-stone-200",
    };
    const STATUS_LABEL = {
      pending_approval: "Pending approval",
      scheduled:        "Scheduled ✓",
      rejected:         "Rejected",
      no_dispatch:      "No dispatch needed",
    };

    function Badge({ tone = "neutral", children }) {
      const styles = {
        neutral:  "bg-stone-100 text-stone-700 border-stone-200",
        ok:       "bg-emerald-100 text-emerald-700 border-emerald-200",
        warn:     "bg-orange-100 text-orange-700 border-orange-200",
        danger:   "bg-rose-100 text-rose-700 border-rose-200",
        info:     "bg-blue-50 text-blue-700 border-blue-200",
      };
      return (
        <span className={cls("inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium border", styles[tone] || styles.neutral)}>
          {children}
        </span>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Header
    // ─────────────────────────────────────────────────────────────────────
    function Header({ onRefresh, jobsCount, onViewJobs, onClearJobs }) {
      return (
        <header className="h-14 border-b border-stone-200 bg-white flex items-center justify-between px-6 shrink-0">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-md bg-stone-900 flex items-center justify-center text-white text-sm font-bold">E</div>
            <div>
              <div className="text-sm font-semibold text-stone-900">Empire Smart-Dispatcher</div>
              <div className="text-xs text-stone-500">Triage console · {jobsCount} job{jobsCount !== 1 ? "s" : ""} pending</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button
              onClick={onViewJobs}
              className="text-xs text-white bg-stone-800 hover:bg-stone-900 px-3 py-1.5 rounded-md transition flex items-center gap-1.5"
            >
              <span>📋</span> View all jobs
            </button>
            <button
              onClick={onClearJobs}
              className="text-xs text-rose-600 hover:text-rose-800 px-3 py-1.5 rounded-md border border-rose-200 hover:bg-rose-50 transition"
              title="Clear all jobs (dev only)"
            >
              🗑 Clear jobs
            </button>
            <button
              onClick={onRefresh}
              className="text-xs text-stone-600 hover:text-stone-900 px-3 py-1.5 rounded-md border border-stone-200 hover:bg-stone-50 transition"
            >
              ↻ Refresh
            </button>
          </div>
        </header>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Jobs drawer
    // ─────────────────────────────────────────────────────────────────────
    function JobsDrawer({ jobs, onClose, onJobsChanged }) {
      const [resetting, setResetting] = React.useState(null);
      const [localJobs, setLocalJobs] = React.useState(jobs);

      useEffect(() => { setLocalJobs(jobs); }, [jobs]);

      const resetJob = async (job_id) => {
        setResetting(job_id);
        try {
          const res = await fetch(`${API}/jobs/${job_id}/reset`, { method: "POST" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const updated = await res.json();
          setLocalJobs(prev => prev.map(j => j.job_id === job_id ? updated : j));
          onJobsChanged();
        } finally {
          setResetting(null);
        }
      };

      const grouped = {
        scheduled:        localJobs.filter(j => j.status === "scheduled"),
        pending_approval: localJobs.filter(j => j.status === "pending_approval"),
        rejected:         localJobs.filter(j => j.status === "rejected"),
        no_dispatch:      localJobs.filter(j => j.status === "no_dispatch"),
      };
      const sections = [
        { key: "scheduled",        label: "Approved & Dispatched", icon: "✅", style: "text-emerald-700" },
        { key: "pending_approval", label: "Pending Approval",       icon: "⏳", style: "text-amber-700"   },
        { key: "rejected",         label: "Rejected",               icon: "✕",  style: "text-rose-700"    },
        { key: "no_dispatch",      label: "No Dispatch Needed",     icon: "—",  style: "text-stone-500"   },
      ];
      const canReset = (status) => status === "scheduled" || status === "rejected";

      return (
        <div className="fixed inset-0 z-40 flex justify-end">
          <div className="absolute inset-0 bg-black/30" onClick={onClose} />
          <div className="relative w-full max-w-lg bg-white shadow-xl flex flex-col overflow-hidden">
            <div className="flex items-center justify-between px-5 py-4 border-b border-stone-200">
              <h2 className="text-sm font-semibold text-stone-900">All Jobs</h2>
              <button onClick={onClose} className="text-stone-400 hover:text-stone-700 text-lg leading-none">✕</button>
            </div>
            <div className="flex-1 overflow-y-auto p-5 space-y-6">
              {localJobs.length === 0 && (
                <p className="text-sm text-stone-400 text-center mt-10">No jobs yet.</p>
              )}
              {sections.map(({ key, label, icon, style }) => {
                const list = grouped[key];
                if (!list.length) return null;
                return (
                  <div key={key}>
                    <h3 className={cls("text-xs font-semibold uppercase tracking-wider mb-2", style)}>
                      {icon} {label} ({list.length})
                    </h3>
                    <div className="space-y-2">
                      {list.map(job => (
                        <div key={job.job_id} className={cls(
                          "rounded-lg border px-4 py-3 text-xs",
                          job.status === "scheduled"        ? "border-emerald-200 bg-emerald-50" :
                          job.status === "pending_approval" ? "border-amber-200 bg-amber-50"    :
                          job.status === "rejected"         ? "border-rose-200 bg-rose-50"      :
                                                              "border-stone-200 bg-stone-50"
                        )}>
                          <div className="flex items-center justify-between mb-1">
                            <span className="font-semibold text-stone-800">{job.job_id}</span>
                            <span className={cls("font-medium px-2 py-0.5 rounded-full border text-xs", STATUS_STYLE[job.status])}>
                              {STATUS_LABEL[job.status]}
                            </span>
                          </div>
                          <div className="text-stone-500 space-y-0.5">
                            {job.ticket_id      && <div>Ticket: <span className="text-stone-700">{job.ticket_id}</span></div>}
                            {job.tech_name      && <div>Technician: <span className="text-stone-700">{job.tech_name}</span></div>}
                            {job.scheduled_date && <div>Date: <span className="text-stone-700">{job.scheduled_date}</span></div>}
                            {job.last_action_at && <div>Updated: <span className="text-stone-700">{job.last_action_at.replace("T"," ").replace("Z","")}</span></div>}
                          </div>
                          {canReset(job.status) && (
                            <button
                              onClick={() => resetJob(job.job_id)}
                              disabled={resetting === job.job_id}
                              className="mt-2 text-xs text-stone-500 hover:text-stone-800 underline disabled:opacity-50"
                            >
                              {resetting === job.job_id ? "Resetting…" : "↩ Reset to pending"}
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Sidebar / inbox
    // ─────────────────────────────────────────────────────────────────────
    function Sidebar({ tickets, selectedId, onSelect }) {
      return (
        <aside className="w-80 shrink-0 border-r border-stone-200 bg-white overflow-y-auto">
          <div className="px-4 pt-4 pb-2 sticky top-0 bg-white border-b border-stone-100">
            <h2 className="text-xs font-semibold uppercase tracking-wider text-stone-500">Inbox</h2>
            <p className="text-xs text-stone-400 mt-0.5">{tickets.length} open ticket{tickets.length !== 1 ? "s" : ""}</p>
          </div>
          <ul>
            {tickets.map(t => (
              <li key={t.ticket_id}>
                <button
                  onClick={() => onSelect(t.ticket_id)}
                  className={cls(
                    "w-full text-left px-4 py-3 border-b border-stone-100 hover:bg-stone-50 transition",
                    selectedId === t.ticket_id && "bg-blue-50 hover:bg-blue-50 border-l-2 border-l-blue-600"
                  )}
                >
                  <div className="flex items-center justify-between gap-2 mb-1">
                    <span className="text-xs font-mono text-stone-500">{t.ticket_id}</span>
                    <span className="text-[10px] text-stone-400">{t.customer_region}</span>
                  </div>
                  <div className="text-sm font-medium text-stone-900 truncate">{t.subject || "(no subject)"}</div>
                  <div className="text-xs text-stone-500 truncate mt-0.5">{t.customer_name}</div>
                </button>
              </li>
            ))}
          </ul>
        </aside>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Empty state
    // ─────────────────────────────────────────────────────────────────────
    function EmptyState() {
      return (
        <div className="flex-1 flex items-center justify-center">
          <div className="text-center">
            <div className="text-5xl mb-4 text-stone-400">←</div>
            <div className="text-base font-bold text-stone-700">Select a ticket from the inbox to begin</div>
            <div className="text-sm text-stone-400 mt-1">Click any ticket on the left to run the agent</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Ticket detail card
    // ─────────────────────────────────────────────────────────────────────
    function TicketCard({ ticket }) {
      return (
        <div className="bg-white border border-stone-200 rounded-lg p-5">
          <div className="flex items-start justify-between gap-3 mb-3">
            <div>
              <div className="text-xs font-mono text-stone-500 mb-1">{ticket.ticket_id}</div>
              <h2 className="text-lg font-semibold text-stone-900">{ticket.subject || "(no subject)"}</h2>
            </div>
            <Badge tone="info">{ticket.customer_region}</Badge>
          </div>
          <div className="text-xs text-stone-500 mb-3">
            From <span className="text-stone-700 font-medium">{ticket.customer_name}</span>
            {ticket.received_at && (
              <span className="ml-2">· {new Date(ticket.received_at).toLocaleString()}</span>
            )}
            {ticket.channel && <span className="ml-2">· via {ticket.channel}</span>}
          </div>
          <p className="text-sm text-stone-700 leading-relaxed whitespace-pre-wrap">{ticket.body}</p>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Diagnosis text formatter
    // Strips ## headings and **Bold.** markdown, renders each field label on its own line
    // Returns an ordered [{label, content}] list, or null if the text has no **Label.** markers.
    function parseDiagnosisSections(text) {
      if (!text) return null;
      const withoutHeading = text.replace(/^##\s+[^\n*]+/, '').trim();
      const parts = withoutHeading.split(/\*\*([^*\n]+?)[.:]\*\*\s*/);
      if (parts.length <= 1) return null;
      const sections = [];
      for (let i = 1; i < parts.length - 1; i += 2) {
        const label = parts[i];
        const content = (parts[i + 1] || '').trim();
        if (label && content) sections.push({ label, content });
      }
      return sections;
    }

    function renderInlineCode(content) {
      return content.split(/`([^`]+)`/).map((chunk, idx) =>
        idx % 2 === 1
          ? <code key={idx} className="font-mono text-[11px] px-1 py-0.5 bg-stone-100 rounded text-stone-700 border border-stone-200">{chunk}</code>
          : chunk
      );
    }

    function DiagnosisSummary({ text }) {
      if (!text) return <span className="italic text-stone-400">(no diagnosis summary)</span>;

      const sections = parseDiagnosisSections(text);
      if (!sections) {
        return <p className="text-sm text-stone-700 leading-relaxed">{text}</p>;
      }

      return (
        <div className="space-y-2 mt-1">
          {sections.map(({ label, content }) => (
            <div key={label} className="text-sm leading-relaxed">
              <span className="font-semibold text-stone-800">{label}. </span>
              <span className="text-stone-600">{renderInlineCode(content)}</span>
            </div>
          ))}
        </div>
      );
    }

    // Plan card sections
    // ─────────────────────────────────────────────────────────────────────
    function Section({ label, children, accent }) {
      return (
        <div className="border-t border-stone-100 px-5 py-4">
          <div className="text-[10px] font-semibold uppercase tracking-wider text-stone-500 mb-2">
            {label}
          </div>
          {children}
        </div>
      );
    }

    function PlanCard({ plan, onApprove, onReject, onReassign, acting }) {
      const diag = plan.diagnosis || {};
      const part = plan.part || {};
      const tech = plan.technician || {};
      const status = plan.job_status || "pending_approval";
      const statusLocked = status === "scheduled" || status === "rejected";

      return (
        <div className="bg-white border border-stone-200 rounded-lg overflow-hidden">
          {/* Header */}
          <div className="px-5 py-4 bg-stone-50 border-b border-stone-200">
            <div className="flex items-center justify-between gap-3">
              <div>
                <div className="text-xs font-mono text-stone-500 mb-0.5">
                  {plan.job_id || "JOB-?"} · {plan.ticket_id}
                </div>
                <h3 className="text-sm font-semibold text-stone-900">Agent's proposed plan</h3>
              </div>
              <div className="flex items-center gap-2">
                {plan.iterations_used > 1 && (
                  <Badge tone="info">↻ self-corrected · {plan.iterations_used} iter</Badge>
                )}
                <span className={cls(
                  "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium border",
                  STATUS_STYLE[status] || STATUS_STYLE.pending_approval
                )}>
                  {STATUS_LABEL[status] || status}
                </span>
              </div>
            </div>
          </div>

          {/* Diagnosis */}
          <Section label="Diagnosis">
            <div className="flex flex-wrap items-center gap-2 mb-2">
              {diag.error_code && (
                <span className="font-mono text-xs px-2 py-0.5 bg-stone-100 rounded text-stone-700">
                  {diag.error_code}
                </span>
              )}
              {diag.manufacturer && (
                <span className="text-xs text-stone-600">{diag.manufacturer}</span>
              )}
              {diag.severity && (
                <span className={cls(
                  "inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium border",
                  SEVERITY_STYLE[diag.severity] || SEVERITY_STYLE.low
                )}>
                  {diag.severity}
                </span>
              )}
            </div>
            <DiagnosisSummary text={diag.summary} />
          </Section>

          {/* Part */}
          <Section label="Part">
            <div className="flex flex-wrap items-center gap-2 mb-2">
              {part.part_id ? (
                <span className="font-mono text-xs px-2 py-0.5 bg-stone-100 rounded text-stone-700">
                  {part.part_id}
                </span>
              ) : (
                <span className="text-xs italic text-stone-400">no part required</span>
              )}
              {part.part_id && (part.in_stock
                ? <Badge tone="ok">✓ in stock</Badge>
                : <Badge tone="warn">✗ {part.status || "out of stock"}</Badge>
              )}
            </div>
            {part.inventory_note && (
              <p className="text-xs text-stone-500 leading-relaxed">{part.inventory_note}</p>
            )}
          </Section>

          {/* Workaround (only when set) */}
          {plan.workaround && (
            <Section label="Workaround applied">
              <div className="bg-orange-50 border-l-2 border-orange-300 px-3 py-2 rounded-r">
                <p className="text-sm text-stone-700 leading-relaxed">{plan.workaround}</p>
              </div>
            </Section>
          )}

          {/* Technician (primary) */}
          <Section label="Technician · primary">
            {tech.tech_id ? (
              <div className="flex flex-wrap items-center gap-2">
                <span className="text-sm font-medium text-stone-900">{tech.name || tech.tech_id}</span>
                <span className="font-mono text-[11px] px-1.5 py-0.5 bg-stone-100 rounded text-stone-600 border border-stone-200">{tech.tech_id}</span>
                {tech.region && (
                  <Badge tone="info">📍 {tech.region}</Badge>
                )}
                {tech.scheduled_date && (
                  <Badge tone="info">📅 {tech.scheduled_date}</Badge>
                )}
              </div>
            ) : (
              <p className="text-xs italic text-stone-400">no technician assigned</p>
            )}
          </Section>

          {/* Backup technicians */}
          {Array.isArray(plan.backup_technicians) && plan.backup_technicians.length > 0 && (
            <Section label={`Backup options · ${plan.backup_technicians.length}`}>
              <div className="space-y-2">
                {plan.backup_technicians.map((b, i) => (
                  <div key={b.tech_id || i} className="flex items-start gap-3 p-3 rounded-md bg-stone-50 border border-stone-200">
                    <div className="w-7 h-7 rounded-full bg-stone-300 text-white flex items-center justify-center text-[11px] font-bold shrink-0">
                      #{i + 2}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex flex-wrap items-center gap-2 mb-1">
                        <span className="text-sm font-medium text-stone-900">{b.name || "—"}</span>
                        <span className="font-mono text-[11px] px-1.5 py-0.5 bg-white rounded text-stone-600 border border-stone-200">{b.tech_id}</span>
                        <Badge tone="info">📍 {b.region}</Badge>
                        {b.next_available && (
                          <span className="text-[11px] text-stone-500">📅 {b.next_available}</span>
                        )}
                      </div>
                      {(b.certifications || b.skills) && (
                        <div className="text-[11px] text-stone-500 mb-1">
                          {b.certifications && <span>certs: {b.certifications.join(", ")}</span>}
                          {b.certifications && b.skills && " · "}
                          {b.skills && <span>skills: {b.skills.join(", ")}</span>}
                        </div>
                      )}
                      {b.rationale && (
                        <p className="text-[11px] text-stone-500 italic leading-relaxed">{b.rationale}</p>
                      )}
                    </div>
                    {!statusLocked && (
                      <button
                        onClick={() => onReassign(b)}
                        disabled={!!acting}
                        className="shrink-0 self-center px-2.5 py-1 text-[11px] font-medium text-blue-700 bg-blue-50 border border-blue-200 rounded hover:bg-blue-100 disabled:opacity-40 disabled:cursor-not-allowed transition"
                      >
                        {acting === `reassign-${b.tech_id}` ? "Reassigning…" : "Set as primary"}
                      </button>
                    )}
                  </div>
                ))}
              </div>
              <p className="text-[11px] text-stone-400 mt-2">
                Click "Set as primary" to reassign this job to a backup technician.
              </p>
            </Section>
          )}

          {/* Action footer */}
          <div className="px-5 py-4 bg-stone-50 border-t border-stone-200 flex items-center justify-between">
            <div className="text-xs text-stone-500">
              {statusLocked
                ? <span>Decision recorded. No further action available.</span>
                : <span>Review the plan and decide.</span>}
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={onReject}
                disabled={statusLocked || acting || !plan.job_id}
                className="px-4 py-2 text-sm font-medium text-rose-700 bg-white border border-rose-200 rounded-md hover:bg-rose-50 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                {acting === "reject" ? "Rejecting…" : "Reject"}
              </button>
              <button
                onClick={onApprove}
                disabled={statusLocked || acting || !plan.job_id}
                className="px-4 py-2 text-sm font-medium text-white bg-emerald-600 rounded-md hover:bg-emerald-700 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                {acting === "approve" ? "Approving…" : "✓ Approve & dispatch"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Run-agent button
    // ─────────────────────────────────────────────────────────────────────
    function RunBar({ running, error, onRun }) {
      return (
        <div className="bg-white border border-stone-200 rounded-lg p-5">
          <div className="flex items-center justify-between">
            <div>
              <h3 className="text-sm font-semibold text-stone-900">Run the dispatcher agent</h3>
              <p className="text-xs text-stone-500 mt-0.5">
                Triage → Research (RAG) → Inventory → Routing → Plan
              </p>
            </div>
            <button
              onClick={onRun}
              disabled={running}
              className="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition"
            >
              {running ? "Running…" : "▶ Run agent"}
            </button>
          </div>
          {error && (
            <div className="mt-3 text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded px-3 py-2">
              {error}
            </div>
          )}
        </div>
      );
    }

    const PIPELINE_STEPS = ["Triage", "Research", "Inventory", "Routing", "Decision", "Schedule"];

    function PlanSkeleton() {
      const [step, setStep] = React.useState(0);
      const [dot, setDot] = React.useState(0);

      useEffect(() => {
        const stepTimer = setInterval(() => setStep(s => Math.min(s + 1, PIPELINE_STEPS.length - 1)), 1800);
        const dotTimer  = setInterval(() => setDot(d => (d + 1) % 4), 500);
        return () => { clearInterval(stepTimer); clearInterval(dotTimer); };
      }, []);

      const dots = ".".repeat(dot);

      return (
        <div className="bg-white border border-blue-200 rounded-lg p-5">
          <div className="flex items-center gap-3 mb-4">
            <svg className="animate-spin h-5 w-5 text-blue-600 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
              <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
            </svg>
            <span className="text-sm font-semibold text-blue-700">
              Agent running{dots}
            </span>
          </div>
          <div className="flex items-center gap-1.5 flex-wrap">
            {PIPELINE_STEPS.map((label, i) => {
              const done    = i < step;
              const active  = i === step;
              return (
                <React.Fragment key={label}>
                  <span className={cls(
                    "px-2.5 py-1 rounded-full text-xs font-medium transition-all duration-500",
                    done   ? "bg-emerald-100 text-emerald-700" :
                    active ? "bg-blue-100 text-blue-700 ring-1 ring-blue-400" :
                             "bg-stone-100 text-stone-400"
                  )}>
                    {done ? "✓ " : ""}{label}
                  </span>
                  {i < PIPELINE_STEPS.length - 1 && (
                    <span className={cls("text-xs", done ? "text-emerald-400" : "text-stone-300")}>→</span>
                  )}
                </React.Fragment>
              );
            })}
          </div>
          <p className="mt-3 text-xs text-stone-400">This usually takes 5–15 seconds</p>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Toast
    // ─────────────────────────────────────────────────────────────────────
    function Toast({ tone, message, onClose }) {
      useEffect(() => {
        const t = setTimeout(onClose, 4000);
        return () => clearTimeout(t);
      }, []);
      const styles = {
        ok:    "bg-emerald-600 text-white",
        warn:  "bg-orange-600 text-white",
        error: "bg-rose-600 text-white",
        info:  "bg-stone-900 text-white",
      };
      return (
        <div className="fixed bottom-6 right-6 z-50">
          <div className={cls("px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-3", styles[tone] || styles.info)}>
            <span>{message}</span>
            <button onClick={onClose} className="opacity-70 hover:opacity-100">✕</button>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Live feed — auto-plays the first few tickets on page load so a
    // visitor sees the agent working without clicking anything. Runs the
    // real triage call per ticket but never approves/rejects. Only the
    // explicit "Take control" button stops it early; it otherwise stops
    // itself once it has cycled through DEMO_TICKET_COUNT tickets.
    // ─────────────────────────────────────────────────────────────────────
    const DEMO_TICKET_COUNT = 4;
    const DEMO_RESULT_DISPLAY_MS = 5000;
    const DEMO_STEP_INTERVAL_MS = 1100;

    function DemoStepTrail({ step, dark }) {
      return (
        <div className="flex items-center gap-1.5 flex-wrap">
          {PIPELINE_STEPS.map((label, i) => {
            const done = i < step;
            const active = i === step;
            return (
              <React.Fragment key={label}>
                <span className={cls(
                  "px-2 py-0.5 rounded-full text-[11px] font-medium transition-all duration-300",
                  done   ? (dark ? "bg-emerald-500/20 text-emerald-300" : "bg-emerald-100 text-emerald-700") :
                  active ? (dark ? "bg-blue-500/20 text-blue-300 ring-1 ring-blue-400/50" : "bg-blue-100 text-blue-700 ring-1 ring-blue-400") :
                           (dark ? "bg-white/10 text-stone-400" : "bg-stone-100 text-stone-400")
                )}>
                  {done ? "✓ " : ""}{label}
                </span>
                {i < PIPELINE_STEPS.length - 1 && (
                  <span className={cls("text-[11px]", done ? (dark ? "text-emerald-400/60" : "text-emerald-400") : (dark ? "text-white/20" : "text-stone-300"))}>→</span>
                )}
              </React.Fragment>
            );
          })}
        </div>
      );
    }

    // Tab bar — "Live Feed" (autoplay) vs "Manual" (pick any ticket yourself)
    function TabBar({ active, onChange }) {
      const tabs = [
        { key: "live",   label: "Live Feed", icon: "▶" },
        { key: "manual", label: "Manual",    icon: "☰" },
      ];
      return (
        <div className="flex items-center gap-6 px-6 border-b border-stone-200 bg-white shrink-0">
          {tabs.map(t => (
            <button
              key={t.key}
              onClick={() => onChange(t.key)}
              className={cls(
                "flex items-center gap-1.5 py-3 text-sm font-medium border-b-2 -mb-px transition",
                active === t.key
                  ? "border-blue-600 text-blue-700"
                  : "border-transparent text-stone-500 hover:text-stone-800"
              )}
            >
              <span>{t.icon}</span> {t.label}
            </button>
          ))}
        </div>
      );
    }

    function DemoStatusTag({ status }) {
      if (status === "working") {
        return (
          <span className="shrink-0 inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-[11px] font-medium bg-blue-100 text-blue-700">
            <svg className="animate-spin h-3 w-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
              <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
            </svg>
            Working…
          </span>
        );
      }
      if (status === "done") {
        return (
          <span className="shrink-0 inline-flex items-center gap-1 px-2 py-1 rounded-full text-[11px] font-medium bg-emerald-100 text-emerald-700">
            ✓ Done
          </span>
        );
      }
      if (status === "idle") {
        return <span className="shrink-0 text-[11px] text-stone-300">—</span>;
      }
      return (
        <span className="shrink-0 inline-flex items-center px-2 py-1 rounded-full text-[11px] font-medium bg-stone-100 text-stone-400">
          Queued
        </span>
      );
    }

    // Progressively reveals pieces of the (already-fetched) plan in step with the
    // pipeline trail, so it reads like the fields are arriving live: symptom after
    // Triage, root cause/fix after Research, required part after Inventory, etc.
    // The dispatched technician only appears once `showTechnician` (the whole
    // pipeline, including Schedule, has finished) — everything else stays on
    // this same panel, it just pauses here before the next ticket starts.
    function LiveDiagnosisPreview({ plan, step, showTechnician }) {
      const diag = plan.diagnosis || {};
      const part = plan.part || {};
      const tech = plan.technician || {};
      const sections = parseDiagnosisSections(diag.summary) || [];

      let revealCount = 0;
      if (step >= 5) revealCount = sections.length;       // Decision done
      else if (step >= 3) revealCount = Math.min(4, sections.length); // Inventory done
      else if (step >= 2) revealCount = Math.min(3, sections.length); // Research done
      else if (step >= 1) revealCount = Math.min(1, sections.length); // Triage done
      const visible = sections.slice(0, revealCount);

      const showPart = step >= 3; // Inventory done
      const showWorkaround = step >= 5 && plan.workaround; // Decision done

      if (!visible.length && !diag.error_code && !showPart && !showWorkaround && !showTechnician) {
        return null;
      }

      return (
        <div className="space-y-3">
          {diag.error_code && step >= 1 && (
            <div className="flex flex-wrap items-center gap-2 demo-reveal">
              <span className="font-mono text-xs px-2 py-0.5 bg-stone-100 rounded text-stone-700">{diag.error_code}</span>
              {diag.severity && step >= 5 && (
                <span className={cls("inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium border", SEVERITY_STYLE[diag.severity] || SEVERITY_STYLE.low)}>
                  {diag.severity}
                </span>
              )}
            </div>
          )}
          {visible.map(({ label, content }) => (
            <div key={label} className="text-sm leading-relaxed demo-reveal">
              <span className="font-semibold text-stone-800">{label}. </span>
              <span className="text-stone-600">{renderInlineCode(content)}</span>
            </div>
          ))}
          {showPart && (
            <div className="demo-reveal flex flex-wrap items-center gap-2 pt-1">
              <span className="text-[10px] font-semibold uppercase tracking-wider text-stone-400">Part</span>
              {part.part_id ? (
                <>
                  <span className="font-mono text-xs px-2 py-0.5 bg-stone-100 rounded text-stone-700">{part.part_id}</span>
                  {part.in_stock
                    ? <Badge tone="ok">✓ in stock</Badge>
                    : <Badge tone="warn">✗ {part.status || "out of stock"}</Badge>}
                </>
              ) : (
                <span className="text-xs italic text-stone-400">no part required</span>
              )}
            </div>
          )}
          {showWorkaround && (
            <div className="demo-reveal bg-orange-50 border-l-2 border-orange-300 px-3 py-2 rounded-r">
              <p className="text-sm text-stone-700 leading-relaxed">{plan.workaround}</p>
            </div>
          )}
          {showTechnician && (
            <div className="demo-reveal pt-2 border-t border-stone-100">
              <div className="text-[10px] font-semibold uppercase tracking-wider text-stone-400 mb-1.5">Dispatched technician</div>
              {tech.tech_id ? (
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-sm font-medium text-stone-900">{tech.name || tech.tech_id}</span>
                  <span className="font-mono text-[11px] px-1.5 py-0.5 bg-stone-100 rounded text-stone-600 border border-stone-200">{tech.tech_id}</span>
                  {tech.region && <Badge tone="info">📍 {tech.region}</Badge>}
                  {tech.scheduled_date && <Badge tone="info">📅 {tech.scheduled_date}</Badge>}
                </div>
              ) : (
                <p className="text-xs italic text-stone-400">no technician assigned</p>
              )}
            </div>
          )}
        </div>
      );
    }

    function LiveFeed({ tickets }) {
      const demoTickets = React.useMemo(() => tickets.slice(0, DEMO_TICKET_COUNT), [tickets]);
      const [index, setIndex] = React.useState(0);
      const [step, setStep] = React.useState(0);
      const [livePlan, setLivePlan] = React.useState(null); // available as soon as the fetch resolves, for the progressive preview
      const [liveError, setLiveError] = React.useState(null);
      const [allStepsShown, setAllStepsShown] = React.useState(false); // pipeline fully played out for the current ticket (incl. technician reveal)
      const [phase, setPhase] = React.useState("running"); // running | done
      const [wasStopped, setWasStopped] = React.useState(false);

      const stoppedRef = React.useRef(false);
      const startedRef = React.useRef(false);
      const timers = React.useRef([]);

      const track = (id) => { timers.current.push(id); return id; };
      const clearTimers = () => {
        timers.current.forEach(id => { clearTimeout(id); clearInterval(id); });
        timers.current = [];
      };

      const takeControl = () => {
        stoppedRef.current = true;
        clearTimers();
        setWasStopped(true);
        setPhase("done");
      };

      const runStep = async (i) => {
        const ticket = demoTickets[i];
        if (!ticket) { setPhase("done"); return; }
        setIndex(i);
        setLivePlan(null);
        setLiveError(null);
        setAllStepsShown(false);
        setStep(0);
        setPhase("running");

        // The step trail must play through every stage — including a beat
        // where the final stage itself shows done (all-green) — before the
        // ticket "settles" (technician revealed, feed paused) here, even if
        // the real triage call finishes early. stepCount runs
        // 1..PIPELINE_STEPS.length; the last value has no step index equal
        // to it, so DemoStepTrail renders every stage as done ("i < step"
        // is true for all i) instead of the last one staying stuck active.
        const totalTicks = PIPELINE_STEPS.length;
        let stepCount = 0;
        let fetchDone = false;
        let settled = false;

        const maybeSettle = () => {
          if (settled || stoppedRef.current || !fetchDone || stepCount < totalTicks) return;
          settled = true;
          setAllStepsShown(true);
          track(setTimeout(() => {
            if (stoppedRef.current) return;
            runStep(i + 1);
          }, DEMO_RESULT_DISPLAY_MS));
        };

        const stepTimer = track(setInterval(() => {
          stepCount = Math.min(stepCount + 1, totalTicks);
          setStep(stepCount);
          if (stepCount >= totalTicks) {
            clearInterval(stepTimer);
            // Hold on the all-green frame for one more beat so it actually
            // paints before we (maybe) settle straight away.
            track(setTimeout(() => {
              if (stoppedRef.current) return;
              maybeSettle();
            }, DEMO_STEP_INTERVAL_MS));
          }
        }, DEMO_STEP_INTERVAL_MS));

        try {
          const res = await fetch(`${API}/tickets/triage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              ticket_id: ticket.ticket_id,
              customer_name: ticket.customer_name,
              customer_region: ticket.customer_region,
              subject: ticket.subject,
              body: ticket.body,
            }),
          });
          if (stoppedRef.current) return;
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (stoppedRef.current) return;
          setLivePlan(data.plan || null); // let the progressive preview start rendering right away
        } catch (e) {
          if (stoppedRef.current) return;
          setLiveError(e.message);
        }

        fetchDone = true;
        maybeSettle();
      };

      React.useEffect(() => {
        if (startedRef.current || !demoTickets.length) return;
        startedRef.current = true;
        runStep(0);
        return clearTimers;
        // eslint-disable-next-line
      }, [demoTickets.length]);

      const replay = () => {
        stoppedRef.current = false;
        setWasStopped(false);
        runStep(0);
      };

      if (!tickets.length) return null;

      const ticket = demoTickets[index];
      const isDone = phase === "done";

      const statusFor = (i) => {
        if (i >= DEMO_TICKET_COUNT) return "idle";
        if (i < index) return "done";
        if (i === index) return (phase === "running" && !allStepsShown) ? "working" : "done";
        return "queued";
      };

      return (
        <div className="h-full overflow-y-auto p-6">
          <div className="max-w-5xl mx-auto space-y-4">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-base font-semibold text-stone-900">Live triage feed</h2>
                <p className="text-xs text-stone-500 mt-0.5">Watching the agent triage incoming tickets in real time.</p>
              </div>
              {!isDone ? (
                <button
                  onClick={takeControl}
                  className="text-xs text-stone-600 hover:text-stone-900 px-3 py-1.5 rounded-md border border-stone-200 hover:bg-stone-50 transition"
                >
                  ⏭ Take control
                </button>
              ) : (
                <button
                  onClick={replay}
                  className="text-xs text-stone-600 hover:text-stone-900 px-3 py-1.5 rounded-md border border-stone-200 hover:bg-stone-50 transition"
                >
                  ▶ Replay demo
                </button>
              )}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-[280px_1fr_360px] gap-4 items-start">
              {/* Left column: full inbox — only the first DEMO_TICKET_COUNT get auto-run */}
              <div className="bg-white border border-stone-200 rounded-lg overflow-hidden">
                <div className="px-4 pt-4 pb-2">
                  <div className="text-[10px] font-semibold uppercase tracking-wider text-stone-500">Inbox</div>
                  <p className="text-[11px] text-stone-400 mt-0.5">
                    {tickets.length} ticket{tickets.length !== 1 ? "s" : ""} · auto-running the first {Math.min(DEMO_TICKET_COUNT, tickets.length)}
                  </p>
                </div>
                <ul className="max-h-[460px] overflow-y-auto">
                  {tickets.map((t, i) => (
                    <li key={t.ticket_id} className={cls(
                      "px-4 py-3 border-t border-stone-100",
                      i === index && !isDone && i < DEMO_TICKET_COUNT && "bg-blue-50/50"
                    )}>
                      <div className="flex items-start justify-between gap-2">
                        <div className="min-w-0">
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-mono text-stone-500">{t.ticket_id}</span>
                            <span className="text-[10px] text-stone-400">{t.customer_region}</span>
                          </div>
                          <div className="text-sm font-medium text-stone-900 truncate mt-0.5">{t.subject || "(no subject)"}</div>
                        </div>
                        <DemoStatusTag status={statusFor(i)} />
                      </div>
                    </li>
                  ))}
                </ul>
                {isDone && (
                  <div className="px-4 py-3 border-t border-stone-100 text-xs text-stone-400">
                    {wasStopped ? "Autoplay stopped." : "Autoplay finished."}
                  </div>
                )}
              </div>

              {/* Middle column: live ticket read-out */}
              <div className="bg-white border border-stone-200 rounded-lg overflow-hidden">
                {ticket ? (
                  <div className="relative bg-stone-900 min-h-[420px] flex flex-col">
                    <div className="absolute top-3 left-3 flex items-center gap-1.5 px-2 py-1 rounded-full bg-black/40 text-rose-300 text-[11px] font-medium">
                      <span className={cls("w-1.5 h-1.5 rounded-full bg-rose-400", !isDone && "animate-pulse")}></span>
                      {isDone ? (wasStopped ? "STOPPED" : "DONE") : "LIVE"}
                    </div>
                    <div className="absolute top-3 right-3 px-2 py-1 rounded-full bg-black/40 text-stone-300 text-[11px] font-mono">
                      {index + 1} / {demoTickets.length}
                    </div>
                    <div className="flex-1 overflow-y-auto p-6 pt-12 text-stone-300 text-sm leading-relaxed whitespace-pre-wrap font-mono">
                      {ticket.body || "(no ticket body)"}
                    </div>
                    <div className="p-3 bg-black/30 border-t border-white/10">
                      <DemoStepTrail step={step} dark />
                    </div>
                  </div>
                ) : (
                  <div className="p-6 text-sm text-stone-400">No ticket selected.</div>
                )}
              </div>

              {/* Right column: diagnosis fields arrive here live as the pipeline progresses */}
              <div className="bg-white border border-stone-200 rounded-lg overflow-hidden">
                {ticket && (
                  <>
                    <div className="px-5 py-4 bg-stone-50 border-b border-stone-200 flex items-center justify-between gap-3">
                      <div>
                        <div className="text-xs font-mono text-stone-500 mb-0.5">{ticket.ticket_id}</div>
                        <h3 className="text-sm font-semibold text-stone-900">{ticket.subject || "(no subject)"}</h3>
                      </div>
                      {isDone && <Badge tone="neutral">{wasStopped ? "Stopped" : "Finished"}</Badge>}
                    </div>
                    <div className="p-5">
                      {liveError ? (
                        <div className="text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded px-3 py-2">{liveError}</div>
                      ) : livePlan ? (
                        <LiveDiagnosisPreview plan={livePlan} step={step} showTechnician={allStepsShown} />
                      ) : (
                        <p className="text-xs text-stone-400">Waiting for agent…</p>
                      )}
                    </div>
                  </>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────
    // Root app
    // ─────────────────────────────────────────────────────────────────────
    function App() {
      const [tickets, setTickets] = useState((window.__PRELOADED__ || {}).tickets || []);
      const [jobs,    setJobs]    = useState((window.__PRELOADED__ || {}).jobs    || []);
      const [selectedId, setSelectedId] = useState(null);
      const [plan, setPlan] = useState(null);
      const [planOutcome, setPlanOutcome] = useState(null); // "approved" | "rejected" | null
      const [running, setRunning] = useState(false);
      const [acting, setActing] = useState(null);
      const [runError, setRunError] = useState(null);
      const [toast, setToast] = useState(null);
      const [showJobs, setShowJobs] = useState(false);
      const [activeTab, setActiveTab] = useState("live");

      const selected = useMemo(
        () => tickets.find(t => t.ticket_id === selectedId) || null,
        [tickets, selectedId]
      );

      const refresh = async () => {
        try {
          const [tRes, jRes] = await Promise.all([
            fetch(`${API}/tickets`),
            fetch(`${API}/jobs`),
          ]);
          setTickets(await tRes.json());
          setJobs(await jRes.json());
        } catch (e) {
          setToast({ tone: "error", message: "Failed to load data: " + e.message });
        }
      };

      useEffect(() => { refresh(); }, []);

      const selectTicket = (id) => {
        setSelectedId(id);
        setPlan(null);
        setPlanOutcome(null);
        setRunError(null);
      };

      const runAgent = async () => {
        if (!selected) return;
        setRunning(true);
        setPlan(null);
        setRunError(null);
        try {
          const res = await fetch(`${API}/tickets/triage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              ticket_id: selected.ticket_id,
              customer_name: selected.customer_name,
              customer_region: selected.customer_region,
              subject: selected.subject,
              body: selected.body,
            }),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!data.plan) throw new Error("Agent returned no plan");
          setPlan(data.plan);
          await refresh();  // jobs queue updated
          setToast({ tone: "info", message: `Plan ready for ${selected.ticket_id}` });
        } catch (e) {
          setRunError(e.message);
        } finally {
          setRunning(false);
        }
      };

      const act = async (action) => {
        if (!plan?.job_id) return;
        setActing(action);
        try {
          const res = await fetch(`${API}/jobs/${plan.job_id}/${action}`, { method: "POST" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const updated = await res.json();
          setPlan(p => ({ ...p, job_status: updated.status }));
          setPlanOutcome(action === "approve" ? "approved" : "rejected");
          await refresh();
          setToast({
            tone: action === "approve" ? "ok" : "warn",
            message: action === "approve"
              ? `Job ${plan.job_id} approved — technician has been dispatched.`
              : `Job ${plan.job_id} rejected — moved to rejected queue.`,
          });
        } catch (e) {
          setToast({ tone: "error", message: `Action failed: ${e.message}` });
        } finally {
          setActing(null);
        }
      };

      const reassign = async (backup) => {
        if (!plan?.job_id) return;
        setActing(`reassign-${backup.tech_id}`);
        try {
          const res = await fetch(`${API}/jobs/${plan.job_id}/reassign`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              tech_id: backup.tech_id,
              name: backup.name,
              region: backup.region,
              scheduled_date: backup.next_available,
              rationale: "Manually reassigned by dispatcher from backup options.",
            }),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const updated = await res.json();
          setPlan(updated.plan);
          await refresh();
          setToast({ tone: "ok", message: `Reassigned to ${backup.name || backup.tech_id}.` });
        } catch (e) {
          setToast({ tone: "error", message: `Reassign failed: ${e.message}` });
        } finally {
          setActing(null);
        }
      };

      const clearJobs = async () => {
        if (!confirm("Clear all jobs? This cannot be undone.")) return;
        await fetch(`${API}/jobs`, { method: "DELETE" });
        setJobs([]);
      };

      const pendingCount = jobs.filter(j => j.status === "pending_approval").length;

      return (
        <div className="h-screen flex flex-col">
          <Header onRefresh={refresh} jobsCount={pendingCount} onViewJobs={() => setShowJobs(true)} onClearJobs={clearJobs} />
          <TabBar active={activeTab} onChange={setActiveTab} />
          <div className="flex-1 relative overflow-hidden">
            <div className={cls("absolute inset-0", activeTab !== "live" && "hidden")}>
              <LiveFeed tickets={tickets} />
            </div>
            <div className={cls("absolute inset-0 flex overflow-hidden", activeTab !== "manual" && "hidden")}>
              <Sidebar tickets={tickets} selectedId={selectedId} onSelect={selectTicket} />
              <main className="flex-1 overflow-y-auto p-6">
              {!selected ? (
                <EmptyState />
              ) : (
                <div className="max-w-3xl mx-auto space-y-4">
                  <TicketCard ticket={selected} />
                  {!plan && !running && (
                    <RunBar running={running} error={runError} onRun={runAgent} />
                  )}
                  {running && <PlanSkeleton />}
                  {plan && (
                    <PlanCard
                      plan={plan}
                      acting={acting}
                      onApprove={() => act("approve")}
                      onReject={() => act("reject")}
                      onReassign={reassign}
                    />
                  )}
                  {plan && planOutcome === "approved" && (
                    <div className="rounded-lg border border-emerald-300 bg-emerald-50 px-5 py-4 flex items-start gap-3">
                      <span className="text-2xl leading-none">✅</span>
                      <div>
                        <p className="text-sm font-semibold text-emerald-800">Dispatched successfully</p>
                        <p className="text-xs text-emerald-700 mt-0.5">
                          Job <strong>{plan.job_id}</strong> has been approved. The technician has been scheduled and the job is now in the queue.
                        </p>
                        <button onClick={() => setShowJobs(true)} className="mt-2 text-xs text-emerald-700 underline hover:text-emerald-900">
                          View all jobs →
                        </button>
                      </div>
                    </div>
                  )}
                  {plan && planOutcome === "rejected" && (
                    <div className="rounded-lg border border-rose-300 bg-rose-50 px-5 py-4 flex items-start gap-3">
                      <span className="text-2xl leading-none">✕</span>
                      <div>
                        <p className="text-sm font-semibold text-rose-800">Proposal rejected</p>
                        <p className="text-xs text-rose-700 mt-0.5">
                          Job <strong>{plan.job_id}</strong> has been rejected and moved to the rejected queue for manual handling.
                        </p>
                        <div className="flex gap-3 mt-2">
                          <button onClick={() => setShowJobs(true)} className="text-xs text-rose-700 underline hover:text-rose-900">
                            View rejected jobs →
                          </button>
                          <button onClick={() => { setPlan(null); setPlanOutcome(null); setRunError(null); }} className="text-xs text-stone-500 underline hover:text-stone-800">
                            Run agent again
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                  {plan && !planOutcome && (
                    <button
                      onClick={() => { setPlan(null); setPlanOutcome(null); setRunError(null); }}
                      className="text-xs text-stone-500 hover:text-stone-900 underline"
                    >
                      ← run again
                    </button>
                  )}
                </div>
              )}
              </main>
            </div>
          </div>
          {showJobs && <JobsDrawer jobs={jobs} onClose={() => setShowJobs(false)} onJobsChanged={refresh} />}
          {toast && <Toast {...toast} onClose={() => setToast(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
